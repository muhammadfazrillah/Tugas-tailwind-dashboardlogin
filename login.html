<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .blob-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            top: -80px;
            left: -80px;
            animation: float 6s ease-in-out infinite;
        }
        .blob-2 {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            bottom: -60px;
            right: -60px;
            animation: float 8s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        .animate-delay-100 { animation-delay: 0.1s; opacity: 0; }
        .animate-delay-200 { animation-delay: 0.2s; opacity: 0; }
        .animate-delay-300 { animation-delay: 0.3s; opacity: 0; }
        .animate-delay-400 { animation-delay: 0.4s; opacity: 0; }
        .logo-glow {
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.4));
        }
        .input-focus-effect:focus {
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center gradient-bg relative overflow-hidden p-4">

    <!-- Decorative Blobs -->
    <div class="blob-1"></div>
    <div class="blob-2"></div>
    <div class="absolute top-1/4 right-10 w-16 h-16 bg-white/5 rounded-full animate-pulse"></div>
    <div class="absolute bottom-1/3 left-10 w-10 h-10 bg-white/5 rounded-full animate-pulse" style="animation-delay: 1s;"></div>

    <!-- Login Card -->
    <div class="w-full max-w-md relative z-10">
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 md:p-10 border border-white/20 animate-fade-in-up">
            
            <!-- Logo Section -->
            <div class="text-center mb-8 animate-fade-in-up animate-delay-100">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl gradient-bg shadow-lg shadow-purple-500/30 mb-5 logo-glow">
                    <img src="40.png" alt="Logo" class="w-12 h-12">
                </div>
                <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Magang</h1>
                <p class="text-sm text-gray-500 mt-2">Silakan masuk untuk melanjutkan</p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-5">
                <div class="animate-fade-in-up animate-delay-200">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                        <span class="flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            Email / Username
                        </span>
                    </label>
                    <input type="text" id="username" placeholder="nama@email.com atau username" required
                        class="input-focus-effect w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 text-sm bg-gray-50/50 hover:bg-white">
                </div>

                <div class="animate-fade-in-up animate-delay-200">
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="text-sm font-semibold text-gray-700">
                            <span class="flex items-center gap-1.5">
                                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                                Password
                            </span>
                        </label>
                        <a href="#" class="text-xs text-purple-600 hover:text-purple-800 hover:underline font-medium transition">Lupa Password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" placeholder="••••••••" required
                            class="input-focus-effect w-full px-4 py-3 pr-11 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 text-sm bg-gray-50/50 hover:bg-white">
                        <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition cursor-pointer">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center animate-fade-in-up animate-delay-300">
                    <input type="checkbox" id="remember" class="h-4 w-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500 cursor-pointer">
                    <label for="remember" class="ml-2 text-sm text-gray-600 select-none cursor-pointer">Ingat saya</label>
                </div>

                <!-- Tombol Masuk -->
                <button type="submit" class="animate-fade-in-up animate-delay-300 w-full gradient-bg hover:opacity-90 text-white font-semibold py-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-purple-500/30 cursor-pointer hover:shadow-xl hover:shadow-purple-500/40 hover:-translate-y-0.5 active:translate-y-0">
                    <span class="flex items-center justify-center gap-2">
                        Masuk
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                        </svg>
                    </span>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative flex py-6 items-center animate-fade-in-up animate-delay-400">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-xs font-medium uppercase tracking-wider">Belum punya akun?</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Tombol Register -->
            <a href="register.html" 
                class="animate-fade-in-up animate-delay-400 block w-full text-center bg-gray-50 hover:bg-gray-100 text-purple-700 border-2 border-purple-100 hover:border-purple-200 font-semibold py-3 rounded-xl transition duration-200 text-sm cursor-pointer hover:-translate-y-0.5">
                <span class="flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                    Buat Akun Baru
                </span>
            </a>

            <!-- Footer -->
            <p class="text-center text-xs text-gray-400 mt-8 animate-fade-in-up animate-delay-400">
                © 2026 <span class="font-medium">Siswa Magang</span>
            </p>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                `;
            }
        }

        // Redirect if already logged in
        if (localStorage.getItem('is_logged_in') === 'true') {
            window.location.href = 'dashboard.html';
        }

        // Default user
        const defaultUser = {
            nama: "Fazri",
            username: "fazri",
            password: "123",
            role: "Siswa Magang",
            avatar: "https://cdn.phototourl.com/free/2026-07-08-26222bfa-d396-4f24-9e05-141b2d267171.png"
        };

        if (!localStorage.getItem('registered_users')) {
            localStorage.setItem('registered_users', JSON.stringify([defaultUser]));
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            
            const registeredUsers = JSON.parse(localStorage.getItem('registered_users'));
            const validUser = registeredUsers.find(user => 
                (user.username === usernameInput || user.nama === usernameInput) && user.password === passwordInput
            );
            
            if (validUser) {
                localStorage.setItem('user_profile', JSON.stringify({
                    nama: validUser.nama,
                    role: validUser.role,
                    avatar: validUser.avatar
                }));
                localStorage.setItem('is_logged_in', 'true');
                
                // Success animation
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="flex items-center justify-center gap-2">✓ Berhasil!</span>';
                btn.classList.add('bg-green-500');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } else {
                // Shake animation on error
                const card = document.querySelector('.bg-white\\/95');
                card.style.animation = 'none';
                card.offsetHeight;
                card.style.animation = 'shake 0.5s ease-in-out';
                
                alert('Username atau Password salah! Silakan coba lagi atau daftar akun baru.');
            }
        });
    </script>

    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
    </style>
</body>
</html>
