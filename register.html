<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .blob-1 {
            position: absolute; width: 300px; height: 300px;
            background: rgba(255,255,255,0.08); border-radius: 50%;
            top: -80px; right: -80px;
            animation: float 6s ease-in-out infinite;
        }
        .blob-2 {
            position: absolute; width: 200px; height: 200px;
            background: rgba(255,255,255,0.06); border-radius: 50%;
            bottom: -60px; left: -60px;
            animation: float 8s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        .animate-delay-100 { animation-delay: 0.1s; opacity: 0; }
        .animate-delay-200 { animation-delay: 0.2s; opacity: 0; }
        .animate-delay-300 { animation-delay: 0.3s; opacity: 0; }
        .animate-delay-400 { animation-delay: 0.4s; opacity: 0; }
        .logo-glow { filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.4)); }
        .input-focus-effect:focus { box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center gradient-bg relative overflow-hidden p-4">

    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="w-full max-w-md relative z-10">
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 md:p-10 border border-white/20 animate-fade-in-up">
            
            <!-- Logo -->
            <div class="text-center mb-8 animate-fade-in-up animate-delay-100">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl gradient-bg shadow-lg shadow-purple-500/30 mb-5 logo-glow">
                    <img src="https://cdn.phototourl.com/free/2026-07-08-26222bfa-d396-4f24-9e05-141b2d267171.png" alt="Logo" class="w-12 h-12">
                </div>
                <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Daftar Akun</h1>
                <p class="text-sm text-gray-500 mt-2">Buat akun untuk mengakses dashboard PKL</p>
            </div>

            <!-- Form Register -->
            <form id="registerForm" class="space-y-4">
                <div class="animate-fade-in-up animate-delay-200">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                        <span class="flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            Nama Lengkap
                        </span>
                    </label>
                    <input type="text" id="reg_nama" placeholder="Masukkan nama lengkap" required
                        class="input-focus-effect w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 text-sm bg-gray-50/50 hover:bg-white">
                </div>

                <div class="animate-fade-in-up animate-delay-200">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                        <span class="flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            Username
                        </span>
                    </label>
                    <input type="text" id="reg_username" placeholder="Buat username unik" required
                        class="input-focus-effect w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 text-sm bg-gray-50/50 hover:bg-white">
                </div>

                <div class="animate-fade-in-up animate-delay-300">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                        <span class="flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            Password
                        </span>
                    </label>
                    <div class="relative">
                        <input type="password" id="reg_password" placeholder="Minimal 3 karakter" required
                            class="input-focus-effect w-full px-4 py-3 pr-11 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 text-sm bg-gray-50/50 hover:bg-white">
                        <button type="button" onclick="togglePassword('reg_password', 'eye1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition cursor-pointer">
                            <svg id="eye1" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="animate-fade-in-up animate-delay-300">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                        <span class="flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                            </svg>
                            Konfirmasi Password
                        </span>
                    </label>
                    <input type="password" id="reg_confirm" placeholder="Ulangi password" required
                        class="input-focus-effect w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 text-sm bg-gray-50/50 hover:bg-white">
                </div>

                <!-- Tombol Daftar -->
                <button type="submit" class="animate-fade-in-up animate-delay-400 w-full gradient-bg hover:opacity-90 text-white font-semibold py-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-purple-500/30 cursor-pointer hover:shadow-xl hover:shadow-purple-500/40 hover:-translate-y-0.5 active:translate-y-0 mt-6">
                    <span class="flex items-center justify-center gap-2">
                        Daftar Sekarang
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                        </svg>
                    </span>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative flex py-6 items-center animate-fade-in-up animate-delay-400">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-xs font-medium uppercase tracking-wider">Sudah punya akun?</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Tombol Login -->
            <a href="login.html" 
                class="animate-fade-in-up animate-delay-400 block w-full text-center bg-gray-50 hover:bg-gray-100 text-purple-700 border-2 border-purple-100 hover:border-purple-200 font-semibold py-3 rounded-xl transition duration-200 text-sm cursor-pointer hover:-translate-y-0.5">
                <span class="flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    Kembali ke Login
                </span>
            </a>

            <p class="text-center text-xs text-gray-400 mt-8 animate-fade-in-up animate-delay-400">
                © 2026 <span class="font-medium">Siswa Magang</span>
            </p>
        </div>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nama = document.getElementById('reg_nama').value.trim();
            const username = document.getElementById('reg_username').value.trim();
            const password = document.getElementById('reg_password').value;
            const confirm = document.getElementById('reg_confirm').value;

            if (password.length < 3) {
                alert('Password minimal 3 karakter!');
                return;
            }

            if (password !== confirm) {
                alert('Password dan konfirmasi password tidak cocok!');
                return;
            }

            let users = JSON.parse(localStorage.getItem('registered_users')) || [];
            
            if (users.find(u => u.username === username)) {
                alert('Username sudah digunakan! Silakan pilih username lain.');
                return;
            }

            const newUser = {
                nama: nama,
                username: username,
                password: password,
                role: "Siswa Magang",
                avatar: "https://cdn.phototourl.com/free/2026-07-08-26222bfa-d396-4f24-9e05-141b2d267171.png"
            };

            users.push(newUser);
            localStorage.setItem('registered_users', JSON.stringify(users));

            // Success feedback
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="flex items-center justify-center gap-2">✓ Berhasil Mendaftar!</span>';
            btn.classList.remove('gradient-bg');
            btn.classList.add('bg-green-500');

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1200);
        });
    </script>
</body>
</html>
